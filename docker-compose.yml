services:

  # ─── Microservicios ──────────────────────────────────────────

  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: kinaleats-auth
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PORT: 3006
      DB_HOST: host.docker.internal
      DB_PORT: 15432
      DB_NAME: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: Robertoandre03072007@
      DB_SQL_LOGGING: "false"
      DB_SSL: "true"
    ports:
      - "3006:3006"
    networks:
      - kinaleats-net

  restaurantes-service:
    build:
      context: ./RestaurantesService
      dockerfile: Dockerfile
    container_name: kinaleats-restaurantes
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PORT: 3007
      URI_MONGO: mongodb+srv://robertoandre0307_db_user:kZhxVvzNlgZawwQa@cluster0.ekpzrcm.mongodb.net/restaurantesdb
      AUTH_SERVICE_URL: http://auth-service:3006
    ports:
      - "3007:3007"
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - kinaleats-net

  pedidos-service:
    build:
      context: ./PedidosReservacionesService
      dockerfile: Dockerfile
    container_name: kinaleats-pedidos
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PORT: 3008
      URI_MONGO: mongodb+srv://robertoandre0307_db_user:kZhxVvzNlgZawwQa@cluster0.ekpzrcm.mongodb.net/restaurantesdb
      AUTH_SERVICE_URL: http://auth-service:3006
    ports:
      - "3008:3008"
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - kinaleats-net

  eventos-service:
    build:
      context: ./EventosReportesService
      dockerfile: Dockerfile
    container_name: kinaleats-eventos
    restart: unless-stopped
    env_file: .env.docker
    environment:
      PORT: 3009
      URI_MONGO: mongodb+srv://robertoandre0307_db_user:kZhxVvzNlgZawwQa@cluster0.ekpzrcm.mongodb.net/restaurantesdb
      AUTH_SERVICE_URL: http://auth-service:3006
    ports:
      - "3009:3009"
    depends_on:
      auth-service:
        condition: service_started
    networks:
      - kinaleats-net

  # ─── Frontend ────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_URL: http://localhost:3006/api/v1/
        VITE_RESTAURANTES_URL: http://localhost:3007/restaurantes/v1
        VITE_MESAS_URL: http://localhost:3007/restaurantes/v1
        VITE_PEDIDOS_URL: http://localhost:3008/restaurantes/v1
        VITE_RESERVACIONES_URL: http://localhost:3008/restaurantes/v1
        VITE_REPORTES_URL: http://localhost:3009/restaurantes/v1
        VITE_CLOUDINARY_BASE_URL: https://res.cloudinary.com/dsgoqqgtd/image/upload/
    container_name: kinaleats-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - restaurantes-service
      - pedidos-service
      - eventos-service
    networks:
      - kinaleats-net

# ─── Red ────────────────────────────────────────────────────
networks:
  kinaleats-net:
    driver: bridge
